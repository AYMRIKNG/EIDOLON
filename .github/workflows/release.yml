name: Release (Windows installer)

# Push a version tag (git tag v1.0.0 && git push origin v1.0.0) — or start it by
# hand from the Actions tab — to build EIDOLON.exe and its installer on a clean
# Windows machine and attach EIDOLON-Setup-<version>.exe to a GitHub Release.
# The release is created as a draft: review it, then publish it yourself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt "pyinstaller>=6.16"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (.venv\Scripts\python.exe packaging\make_version_info.py).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} ≠ APP_VERSION $v (core/branding.py)" }

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/EIDOLON-Setup-*.exe
          generate_release_notes: true

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EIDOLON-Setup
          path: dist/EIDOLON-Setup-*.exe
