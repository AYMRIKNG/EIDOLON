name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-hygiene:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python bytecode compilation
        run: python -m compileall -q -x '(\.venv|__pycache__)' .

      - name: Verify JSON configuration & registry syntax
        run: |
          python - <<'EOF'
          import json, pathlib
          for p in [pathlib.Path("agents/registry.json"), *pathlib.Path("workflows").glob("*.json")]:
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
          EOF
